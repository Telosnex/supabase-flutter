# Upstream sources, checked daily by the Upstream watch workflow
# (telosnex_ci_tools, lib/src/upstream.dart). Set `seen` to skip an update.
#
# The app takes supabase_flutter and realtime_client from this fork. Upstream
# main is the v3 rewrite (3.0.0-dev, packages renamed); v2 releases are tags
# off main. So each source is the stable release tags of one package. The
# pattern matches the whole tag name, so dev releases do not alert; a stable
# 3.0.0 does. The pin is the version in this fork's pubspec: merge the release
# tag, and the pin follows.
sources:
  - name: supabase/supabase-flutter supabase_flutter
    tags: https://github.com/supabase/supabase-flutter.git
    version: 'supabase_flutter-v(\d+\.\d+\.\d+)'
    pin: {file: packages/supabase_flutter/pubspec.yaml, pattern: '\nversion: (\d+\.\d+\.\d+)'}
    alert: patch
  - name: supabase/supabase-flutter realtime_client
    tags: https://github.com/supabase/supabase-flutter.git
    version: 'realtime_client-v(\d+\.\d+\.\d+)'
    pin: {file: packages/realtime_client/pubspec.yaml, pattern: '\nversion: (\d+\.\d+\.\d+)'}
    alert: patch
