name: Integration

on:
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The same tests on each desktop platform. The jobs share the steps of the
  # first (YAML anchor).
  desktop-macos-arm64:
    name: macOS ARM64
    runs-on: macos-26
    timeout-minutes: 30
    steps: &desktop_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@6297b4dbe04372d8f73b1ab775afd16f938c6e23 # v0.5.11
      - run: flutter pub get
      - name: Test realtime_client
        working-directory: packages/realtime_client
        run: dart test -r expanded --exclude-tags integration
      - name: Test supabase_flutter
        working-directory: packages/supabase_flutter
        run: flutter test -r expanded --exclude-tags integration

  desktop-windows-x64:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    steps: *desktop_steps

  # realtime_client in the browsers. The VM-only files (@TestOn('vm')) are
  # left out: they import dart:io.
  web-linux-chrome-dart2js:
    name: Web Linux x64 Chrome dart2js
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER: chrome
      COMPILER: dart2js
    steps: &web_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@6297b4dbe04372d8f73b1ab775afd16f938c6e23 # v0.5.11
      - run: flutter pub get
      - id: files
        working-directory: packages/realtime_client
        run: |
          list=$(grep -L "@TestOn('vm')" $(find test -name '*_test.dart') || true)
          list=$(echo "$list" | tr '\n' ' ')
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: Telosnex/telosnex_ci_tools/actions/dart-test-browser@6297b4dbe04372d8f73b1ab775afd16f938c6e23 # v0.5.11
        with:
          platform: ${{ env.BROWSER }}
          compiler: ${{ env.COMPILER }}
          working-directory: packages/realtime_client
          args: ${{ steps.files.outputs.list }} --exclude-tags integration

  web-linux-chrome-dart2wasm:
    name: Web Linux x64 Chrome dart2wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER: chrome
      COMPILER: dart2wasm
    steps: *web_steps
