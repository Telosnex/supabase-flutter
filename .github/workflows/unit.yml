name: Unit

on:
  pull_request:
    branches: [main]
  push:
    # ci/** branches run it too: a new workflow cannot be started by hand
    # before it is on main.
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Telosnex/telosnex_ci_tools/actions/setup-flutter@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      - uses: Telosnex/telosnex_ci_tools/actions/lint@0554f3662445d678e2effbd838d15968d673f7af # v0.5.6
      # The root is a pub workspace: one resolution covers every member.
      - run: flutter pub get
      # Generated files (first line "// GENERATED ...") keep their generator's
      # layout.
      - name: Format
        run: |
          git ls-files 'packages/realtime_client/*.dart' 'packages/supabase_flutter/*.dart' |
            while read -r f; do head -1 "$f" | grep -qiE '^// *generated' || echo "$f"; done |
            xargs dart format --output=none --set-exit-if-changed
      - name: Analyze realtime_client
        working-directory: packages/realtime_client
        run: dart analyze --fatal-infos
      - name: Analyze supabase_flutter
        working-directory: packages/supabase_flutter
        run: flutter analyze --fatal-infos
      # Integration-tagged tests need a Realtime server (supabase start);
      # upstream's CI does not run them, so neither does this one.
      - name: Test realtime_client
        working-directory: packages/realtime_client
        run: dart test -r expanded --exclude-tags integration
      - name: Test supabase_flutter
        working-directory: packages/supabase_flutter
        run: flutter test -r expanded --exclude-tags integration
