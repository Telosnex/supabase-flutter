\* RealtimeSocket — counterexample config for synchronous transport
\* throw during connect().
\*
\* Invariant StateConsistency EXPECTED TO FAIL.
\*
\* Dart path:
\*   realtime_client.dart:212–262  connect() outer try/catch
\*     line 215: connState = SocketStates.connecting;
\*     line 216: final WebSocketChannel localConn = transport(...);  ← THROWS
\*     line 217: conn = localConn;                                    ← NEVER REACHES
\*     ...
\*     line 259: catch (e) { _onConnError(e); }                       ← silent return
\*
\* After the throw: connState=Connecting, this.conn=null.  Violates
\* StateConsistency (connState ∈ {Connecting, Open, Disconnecting}
\* ⇒ thisConn ≠ 0).  No automatic recovery; the socket is wedged
\* until a subsequent successful connect() call.
\*
\* This path is probably infeasible with the default WebSocket
\* transport (which queues a Future.error rather than throwing
\* synchronously), but an injected transport — used in tests or on
\* some platforms — could exercise it.

SPECIFICATION Spec

CONSTANTS
    MaxAttempts             = 2
    MaxRef                  = 3
    AllowSyncTransportThrow = TRUE

INVARIANTS
    TypeOK
    StateConsistency
