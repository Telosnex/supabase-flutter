\* RealtimeSocket — counterexample config for the generalised
\* reconnect leak (user OR library path).
\*
\* Invariant NoReconnectWithoutConn EXPECTED TO FAIL.
\*
\* Same defect as RealtimeSocket_UserDisconnectBug.cfg, but checks
\* the stronger property that covers library-initiated calls to
\* disconnect() from removeChannel / removeAllChannels.
\*
\* TLC will find either the user or the library path as the minimal
\* trace, depending on action ordering:
\*
\*   a) 1. UserConnect / AutoConnect     → Connecting
\*      2. ConnectReadyError             → Closed, reconnectScheduled=T
\*      3. UserDisconnect                → Disconnecting/Closed (shouldCloseSink=F)
\*      4. FinishDisconnect              → thisConn=0, reconnectScheduled=T ✗
\*
\*   b) replace step 3 with LibraryAutoDisconnect (from
\*      removeChannel/removeAllChannels when last channel leaves) —
\*      identical downstream state.
\*
\* Source: realtime_client.dart:306–319 for the library path;
\*         the underlying bug is still in disconnect() at ~292.

SPECIFICATION Spec

CONSTANTS
    MaxAttempts             = 2
    MaxRef                  = 3
    AllowSyncTransportThrow = FALSE

INVARIANTS
    TypeOK
    NoReconnectWithoutConn
