\* Push — counterexample config demonstrating the weak-guard Send.
\*
\* push.dart line 58 only blocks Send when receivedStatus == 'timeout',
\* NOT on 'ok' or 'error'.  Therefore:
\*
\*   Send → ReplyOk → Send
\*
\* is a LEGAL sequence per the literal Dart semantics, producing
\* (active = TRUE ∧ receivedStatus = "ok").  In practice the call
\* sites do not exercise this (new Push per send, or Resend), but
\* the model exposes the fact that the Dart guard is looser than
\* the single-shot convention it relies on.
\*
\* Invariant AtMostOneLiveReply EXPECTED TO FAIL.

SPECIFICATION Spec

CONSTANTS
    MaxResends         = 2
    AllowDuplicateSend = TRUE

INVARIANT AtMostOneLiveReply
